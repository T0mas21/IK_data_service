version: '3.8'

services:
  config-service:
    build:
      context: .
      dockerfile: ConfigService/Dockerfile
    ports:
      - "8081:8081"

  scrapper-service:
    build:
      context: .
      dockerfile: ScrapperService/Dockerfile
    ports:
      - "8082:8082"

  vector-service:
    build:
      context: .
      dockerfile: VectorService/Dockerfile
    ports:
      - "8083:8083"
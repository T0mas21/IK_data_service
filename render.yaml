services:
  - type: web
    name: config-service
    env: docker
    dockerContext: .
    dockerfilePath: ConfigService/Dockerfile
    plan: free
    buildFilter:
      ignoredPaths:
        - .claude/**
        - "**/*.md"
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SCRAPPER_SERVICE_URL
        value: https://scrapper-service-dpwg.onrender.com
      - key: VECTOR_SERVICE_URL
        value: https://vector-service-xioc.onrender.com

  - type: web
    name: scrapper-service
    env: docker
    dockerContext: .
    dockerfilePath: ScrapperService/Dockerfile
    plan: free
    buildFilter:
      ignoredPaths:
        - .claude/**
        - "**/*.md"
    envVars:
      - key: CONFIG_SERVICE_URL
        value: https://config-service-5zts.onrender.com

  - type: web
    name: vector-service
    env: docker
    dockerContext: .
    dockerfilePath: VectorService/Dockerfile
    plan: free
    buildFilter:
      ignoredPaths:
        - .claude/**
        - "**/*.md"
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BUCKET_NAME
        sync: false